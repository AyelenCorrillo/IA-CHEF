spring.application.name=chefia-app
spring.thymeleaf.cache=false

# Configuración de PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/chefia_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:chefia_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:chefia_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
# update es para que cree las tablas solas
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configuración de Groq
groq.api.key=${GROQ_API_KEY}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
