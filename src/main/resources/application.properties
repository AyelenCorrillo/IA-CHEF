spring.application.name=chefia-app

# Configuración de PostgreSQL
spring.datasource.url=jdbc:postgresql://db:5432/chefia_db
spring.datasource.username=chefia_user
spring.datasource.password=chefia_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
# update es para que cree las tablas solas
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configuración de Groq
groq.api.key=${GROQ_API_KEY}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
