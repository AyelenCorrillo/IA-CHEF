<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>AI Chef — Conectarse</title>
</head>

<body class="bg-[#F8F4ED] min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-2xl shadow-sm border border-[#E4DFD8] w-full max-w-md transition-all duration-300">

        <div class="text-center mb-8">
            <img class="mx-auto h-12 mb-3" src="/images/logo_AIChef.png" alt="Logo AI Chef">
            <p class="text-[#5C544C] text-sm font-gantari">Guardá tus recetas favoritas generadas por IA</p>
        </div>

        <div id="loginSection">
            <h2 class="text-2xl font-bold text-[#2b4c1f] font-barlow mb-6 text-center">Iniciar Sesión</h2>
            <form id="loginForm" onsubmit="ejecutarLogin(event)" class="space-y-4 font-gantari">
                <div>
                    <label class="block text-sm font-medium text-[#5C544C] mb-1">Correo Electrónico</label>
                    <input type="email" id="loginEmail" required
                        class="w-full px-4 py-2.5 rounded-xl border border-[#E4DFD8] bg-[#FDFCFB] focus:outline-none focus:border-[#5B833F] text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-[#5C544C] mb-1">Contraseña</label>
                    <input type="password" id="loginPassword" required
                        class="w-full px-4 py-2.5 rounded-xl border border-[#E4DFD8] bg-[#FDFCFB] focus:outline-none focus:border-[#5B833F] text-sm">
                </div>
                <button type="submit"
                    class="w-full bg-[#5B833F] hover:bg-[#4A6B33] text-white font-bold py-3 px-4 rounded-xl transition-colors duration-200 text-sm shadow-sm cursor-pointer mt-2">
                    Ingresar
                </button>
            </form>
            <p class="text-center text-sm text-[#5C544C] mt-6 font-gantari">
                ¿Aún no tenés cuenta?
                <button onclick="conmutarVista(true)"
                    class="text-[#5B833F] font-bold hover:underline ml-1 cursor-pointer">Registrate acá</button>
            </p>
        </div>

        <div id="registerSection" class="hidden">
            <h2 class="text-2xl font-bold text-[#2b4c1f] font-barlow mb-6 text-center">Crear Cuenta</h2>
            <form id="registerForm" onsubmit="ejecutarRegistro(event)" class="space-y-4 font-gantari">
                <div>
                    <label class="block text-sm font-medium text-[#5C544C] mb-1">Nombre Completo</label>
                    <input type="text" id="regNombre" required
                        class="w-full px-4 py-2.5 rounded-xl border border-[#E4DFD8] bg-[#FDFCFB] focus:outline-none focus:border-[#5B833F] text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-[#5C544C] mb-1">Correo Electrónico</label>
                    <input type="email" id="regEmail" required
                        class="w-full px-4 py-2.5 rounded-xl border border-[#E4DFD8] bg-[#FDFCFB] focus:outline-none focus:border-[#5B833F] text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-[#5C544C] mb-1">Contraseña</label>
                    <input type="password" id="regPassword" required
                        class="w-full px-4 py-2.5 rounded-xl border border-[#E4DFD8] bg-[#FDFCFB] focus:outline-none focus:border-[#5B833F] text-sm">
                </div>
                <button type="submit"
                    class="w-full bg-[#5B833F] hover:bg-[#4A6B33] text-white font-bold py-3 px-4 rounded-xl transition-colors duration-200 text-sm shadow-sm cursor-pointer mt-2">
                    Registrarse
                </button>
            </form>
            <p class="text-center text-sm text-[#5C544C] mt-6 font-gantari">
                ¿Ya tenés una cuenta?
                <button onclick="conmutarVista(false)"
                    class="text-[#5B833F] font-bold hover:underline ml-1 cursor-pointer">Iniciá sesión</button>
            </p>
        </div>

        <div class="text-center mt-6 pt-4 border-t border-[#E4DFD8]">
            <a href="/" class="text-xs text-gray-400 hover:text-[#5B833F] transition-colors font-gantari">← Volver al
                inicio</a>
        </div>
    </div>

    <div id="toast" class="hidden fixed top-4 right-4 px-4 py-3 rounded-lg shadow-lg text-white z-50 bg-gray-800">
    </div>

    <script src="/js/auth.js"></script>
    <script src="/js/ui.js"></script>
</body>

</html>
