<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Home</title>
</head>
<body class= "grid grid-rows-[80px_1fr]">
    <header class="flex flex-row justify-between items-center px-4">
        <div>
            <img src="../static/images/logo_AIChef.png" alt="Logo AI Chef">
        </div>
        <nav>
            <ul class="flex flex-row gap-8 font-gantari">
                <a href="#"><li>Ingredientes</li></a>
                <a href="#"><li>Recetas</li></a>
            </ul>
        </nav>
    </header>
    <main>
        <div class="index-container">
            <div class="tag-description-short">
                <p class="text-[14px] font-basic">Recetas con IA, hechas con lo que tenés</p>
            </div>
            <h1 class="text-[100px] font-fraunces font-bold leading-[1.3]">De la <span class="text-green">heladera</span> al <span class="text-brown-orange">plato</span>.</h1>
            <p class="text-[30px] font-basic leading-[1.5] text-grey">Decinos que tenés en la cocina y la IA te sugiere 
            <span class="text-black">3 recetas</span> paso a paso, como un chef profesional.</p>
            <button class="font-fredoka font-semibold text-[20px] start-cook">Empezar a cocinar</button>
        </div>
    </main>
</body>
</html>
