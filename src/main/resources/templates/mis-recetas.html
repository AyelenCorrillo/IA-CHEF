<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>AI Chef — Mis Recetas Favoritas</title>
</head>

<body class="bg-[#F8F4ED] min-h-screen flex flex-col font-gantari">

    <header
        class="fixed top-0 left-0 w-full h-15 flex flex-row justify-between items-center px-6 z-50 bg-[#F8F4ED]/70 backdrop-blur-md border-b border-[#E4DFD8]">
        <a href="/">
            <img class="logo-AIChef" src="/images/logo_AIChef.png" alt="Logo AI Chef">
        </a>
        <nav>
            <a href="/" class="text-sm md:text-base text-[#5C544C] hover:text-[#5B833F] font-medium transition-colors">
                ← Volver a la Cocina
            </a>
        </nav>
    </header>

    <main class="flex-grow pt-24 px-4 max-w-[1200px] w-full mx-auto">
        <div class="flex items-center gap-3 mb-8 border-b border-[#E4DFD8] pb-4">
            <h1 class="text-3xl font-bold font-fraunces italic">Mis recetas <span
                    class="text-[#C66339]">favoritas</span></h1>
        </div>

        <div id="historial-container" class="space-y-6 mb-12">
            <p class="text-center text-gray-400 py-8 animate-pulse">Buscando tus recetas guardadas en el libro...</p>
        </div>

        <div id="recipes-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-8 justify-items-center mb-12">
        </div>
    </main>

    <section>

        <template id="recipe-template">
            <article
                class="rounded-[28px] overflow-hidden max-w-[350px] bg-white border-[3px] border-[#D9D1C7] shadow-[0_4px_0_#D9D1C7] flex flex-col">

                <div
                    class="h-20 overflow-hidden border-b-2 border-black/10 bg-[#E8E1D7] relative flex items-center justify-center">

                    <svg class="absolute inset-0 w-full h-full opacity-[0.06]" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <pattern id="pattern-receta" x="0" y="0" width="32" height="32"
                                patternUnits="userSpaceOnUse">
                                <circle cx="16" cy="16" r="1" fill="currentColor" class="text-black" />
                                <path d="M8 8 Q16 4 24 8" stroke="currentColor" stroke-width="0.4" fill="none"
                                    class="text-black opacity-40" />
                            </pattern>
                        </defs>

                        <rect width="100%" height="100%" fill="url(#pattern-receta)" />
                    </svg>

                    <div class="relative z-10 flex items-center justify-center">
                        <div
                            class="w-10 h-10 rounded-full bg-[#DCE8CC] flex items-center justify-center border border-dashed border-[#7C9B5A] rotate-6">

                            <img src="/images/chef-hat-green-image.png" alt="chef hat" class="w-6 h-6 rotate-12">
                        </div>
                    </div>
                </div>

                <div class="p-4 md:p-6 flex flex-col flex-1">

                    <h5
                        class="font-fraunces italic font-semibold text-[24px] md:text-[32px] text-[#4B3425] leading-tight mb-4 recipe-title">
                    </h5>

                    <p class="text-[#7D746C] font-barlow text-[14px] md:text-[16px] leading-relaxed mb-6 recipe-desc">
                    </p>

                    <!-- TIEMPO + PORCIONES -->
                    <div class="flex flex-wrap gap-2 md:gap-3 mb-4">

                        <div
                            class="flex items-center gap-1 md:gap-2 px-3 md:px-4 py-1 rounded-full border border-[#9DB27C] bg-[#E5EFD7]">

                            <img src="/images/time.png" class="w-3 h-3 md:w-4 md:h-4">

                            <p class="recipe-time font-barlow font-semibold text-[14px] text-[#6E8B4E]">
                            </p>
                        </div>

                        <div
                            class="flex items-center gap-1 md:gap-2 px-3 md:px-4 py-1 rounded-full border border-[#9DB27C] bg-[#E5EFD7]">

                            <img src="/images/users.png" class="w-3 h-3 md:w-4 md:h-4">

                            <p
                                class="recipe-servings font-barlow font-semibold text-[14px] md:text-[16px] text-[#6E8B4E]">
                            </p>
                        </div>

                    </div>

                    <!-- PASOS -->
                    <div class="border-t-2 border-dashed border-gray-300 pt-4">

                        <button class="recipe-toggle w-full flex justify-between items-center">

                            <div class="flex items-center gap-3">

                                <img src="/images/chef-hat-green.png" class="recipe-hat w-5 h-5 md:w-6 md:h-6">

                                <p class="recipe-text font-barlow text-[14px] md:text-[16px] text-[#6E8B4E] font-bold">

                                    VER PASOS
                                </p>
                            </div>

                            <img src="/images/down-arrow-green.png"
                                class="recipe-arrow w-3 h-3 transition-transform duration-300">
                        </button>

                        <div class="recipe-steps hidden mt-4 text-sm text-[#5C544C] space-y-3">
                        </div>

                    </div>

                    <!-- ELIMINAR -->
                    <div class="mt-5">

                        <button
                            class="recipe-delete w-full px-4 py-2.5 rounded-xl bg-red-50 text-red-500 font-bold text-sm transition hover:bg-red-100 hover:text-red-700">

                            ✕ Eliminar
                        </button>

                    </div>

                </div>
            </article>
        </template>

    </section>

    <div id="toast" class="hidden fixed top-4 right-4 px-4 py-3 rounded-lg shadow-lg text-white z-50 bg-gray-800">
    </div>

    <!-- MODAL CONFIRMACIÓN -->
    <div id="modal-confirmacion"
        class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center z-50">

        <div class="bg-white rounded-2xl shadow-2xl w-[90%] max-w-md p-6 animate-fadeIn">

            <!-- ICONO -->
            <div class="flex justify-center mb-4">
                <div class="w-16 h-16 rounded-full bg-red-100 flex items-center justify-center">
                    <span class="text-3xl">🗑️</span>
                </div>
            </div>

            <!-- TÍTULO -->
            <h2 class="text-2xl font-bold text-center text-gray-800 mb-2">
                Eliminar receta
            </h2>

            <!-- MENSAJE -->
            <p id="modal-mensaje" class="text-center text-gray-600 mb-6">
                ¿Estás segura?
            </p>

            <!-- BOTONES -->
            <div class="flex gap-3 justify-center">

                <button id="btn-cancelar"
                    class="px-5 py-2 rounded-xl bg-gray-200 hover:bg-gray-300 transition font-medium">
                    Cancelar
                </button>

                <button id="btn-confirmar"
                    class="px-5 py-2 rounded-xl bg-red-500 hover:bg-red-600 text-white transition font-medium">
                    Eliminar
                </button>

            </div>
        </div>
    </div>


    <footer class="py-6 text-center text-sm text-gray-400 border-t border-[#E4DFD8] bg-white/50">
        <p>AI Chef - Proyecto Integrador PP4 © 2026</p>
    </footer>

    <script src="/js/historial.js"></script>
    <script src="/js/ui.js"></script>
</body>

</html>
