<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>AI Chef — Mis Recetas Favoritas</title>
</head>
<body class="bg-[#F8F4ED] min-h-screen flex flex-col font-gantari">

    <header class="fixed top-0 left-0 w-full h-15 flex flex-row justify-between items-center px-6 z-50 bg-[#F8F4ED]/70 backdrop-blur-md border-b border-[#E4DFD8]">
        <div>
            <img class="logo-AIChef" src="/images/logo_AIChef.png" alt="Logo AI Chef">
        </div>
        <nav>
            <a href="/" class="text-sm md:text-base text-[#5C544C] hover:text-[#5B833F] font-medium transition-colors">
                ← Volver a la Cocina
            </a>
        </nav>
    </header>

    <main class="flex-grow pt-24 px-4 max-w-4xl w-full mx-auto">
        <div class="flex items-center gap-3 mb-8 border-b border-[#E4DFD8] pb-4">
            <img src="/images/star_icon.png" class="w-7 h-7" style="filter: invert(47%) sepia(18%) saturate(1081%) hue-rotate(54deg) brightness(93%) contrast(85%);">
            <h1 class="text-3xl font-bold text-[#2b4c1f] font-barlow">Mis Recetas Favoritas</h1>
        </div>

        <div id="historial-container" class="space-y-6 mb-12">
            <p class="text-center text-gray-400 py-8 animate-pulse">Buscando tus recetas guardadas en el libro...</p>
        </div>
    </main>

    <footer class="py-6 text-center text-sm text-gray-400 border-t border-[#E4DFD8] bg-white/50">
        <p>AI Chef — Proyecto Integrador PP4 © 2026</p>
    </footer>

    <script src="/js/historial.js"></script>
</body>
</html>
